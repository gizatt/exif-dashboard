[project]
name = "exif-dashboard"
version = "0.1.0"
description = "Scan a photo collection's EXIF into JSONL and render a self-contained HTML dashboard of camera/lens/focal-length usage"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Greg Izatt", email = "gregory.izatt@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "tqdm>=4.70.0",
]

[project.scripts]
exif-dashboard = "exif_dashboard:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
